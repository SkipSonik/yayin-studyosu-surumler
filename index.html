<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yayın Stüdyosu - Giriş</title>
<style>body{font:16px system-ui,sans-serif;background:#0f1115;color:#e5e7eb;display:grid;place-items:center;height:100vh;margin:0}p{max-width:420px;text-align:center}a{color:#38bdf8}</style></head>
<body><p id="m">Yayın Stüdyosu'na geri dönülüyor…</p>
<script>
// Facebook/Meta yalnızca https yönlendirme adresi kabul ediyor. Bu sayfa gelen kodu bilgisayardaki uygulamaya (localhost) aktarır.
(function () {
  var qs = new URLSearchParams(location.search);
  var state = qs.get('state') || new URLSearchParams(location.hash.slice(1)).get('state') || '';
  var m = /^([pt])(\d{2,5})-/.exec(state);
  var port = m ? m[2] : '3017';
  var path = m && m[1] === 't' ? 'tiktok' : 'facebook';
  var to = 'http://localhost:' + port + '/auth/' + path + '/callback' + location.search + location.hash;
  document.getElementById('m').innerHTML = 'Yayın Stüdyosu\'na geri dönülüyor… Olmazsa <a href="' + to.replace(/"/g, '&quot;') + '">buraya tıkla</a> (uygulama açık olmalı).';
  location.replace(to);
})();
</script></body></html>
